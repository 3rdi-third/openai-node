plugins {
    id 'com.android.application'
}

android {
    namespace 'com.threerdi.dfamstyle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.threerdi.dfamstyle'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
