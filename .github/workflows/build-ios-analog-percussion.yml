name: Build 3rdi Analog Percussion iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-3rdi-analog/**'
      - '.github/workflows/build-ios-analog-percussion.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios-3rdi-analog
          xcodegen generate

      - name: Build iPhone Simulator app
        run: |
          cd ios-3rdi-analog
          xcodebuild \
            -project AnalogPercussion.xcodeproj \
            -scheme AnalogPercussion \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone device app
        run: |
          cd ios-3rdi-analog
          xcodebuild \
            -project AnalogPercussion.xcodeproj \
            -scheme AnalogPercussion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package final IPAs
        run: |
          set -euo pipefail
          cd ios-3rdi-analog

          SIM_APP=$(find build-sim -type d -name '*.app' | head -1)
          DEV_APP=$(find build-device -type d -name '*.app' | head -1)

          test -n "$SIM_APP"
          test -n "$DEV_APP"

          ditto -c -k --sequesterRsrc --keepParent \
            "$SIM_APP" \
            3rdi-Analog-Percussion-iOS-Simulator.zip

          rm -rf unsigned-root
          mkdir -p unsigned-root/Payload
          cp -R "$DEV_APP" unsigned-root/Payload/
          (
            cd unsigned-root
            zip -qry ../3rdi-Analog-Percussion-iOS-unsigned.ipa Payload
          )

          rm -rf adhoc-root
          mkdir -p adhoc-root/Payload
          cp -R "$DEV_APP" adhoc-root/Payload/
          ADHOC_APP=$(find adhoc-root/Payload -maxdepth 1 -type d -name '*.app' | head -1)

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$ADHOC_APP"

          codesign --verify --deep --strict --verbose=2 "$ADHOC_APP"
          codesign -dv --verbose=4 "$ADHOC_APP" 2>&1 | tee adhoc-codesign-info.txt

          (
            cd adhoc-root
            zip -qry ../3rdi-Analog-Percussion-iOS-AdHoc-Signed-Final.ipa Payload
          )

          {
            echo "EMBEDDED_PROFILE=$(test -f "$ADHOC_APP/embedded.mobileprovision" && echo yes || echo no)"
            echo "BUNDLE_ID=$(defaults read "$(pwd)/$ADHOC_APP/Info" CFBundleIdentifier 2>/dev/null || true)"
          } | tee final-signing-summary.txt

          rm -rf unsigned-root adhoc-root

          zip -qry \
            3rdi-Analog-Percussion-iOS-Xcode-Source.zip \
            project.yml \
            Sources \
            README.md \
            AnalogPercussion.xcodeproj

      - name: Verify final artifacts
        run: |
          set -euo pipefail
          cd ios-3rdi-analog

          test -s 3rdi-Analog-Percussion-iOS-Simulator.zip
          test -s 3rdi-Analog-Percussion-iOS-unsigned.ipa
          test -s 3rdi-Analog-Percussion-iOS-AdHoc-Signed-Final.ipa
          test -s 3rdi-Analog-Percussion-iOS-Xcode-Source.zip

          unzip -l 3rdi-Analog-Percussion-iOS-AdHoc-Signed-Final.ipa \
            | grep -q 'Payload/.*\.app/'

          grep -q "Signature=adhoc" adhoc-codesign-info.txt
          grep -q "BUNDLE_ID=com.threerdi.analogpercussion" final-signing-summary.txt

          shasum -a 256 \
            3rdi-Analog-Percussion-iOS-unsigned.ipa \
            3rdi-Analog-Percussion-iOS-AdHoc-Signed-Final.ipa \
            3rdi-Analog-Percussion-iOS-Xcode-Source.zip \
            | tee final-artifact-sha256.txt

          echo "Final iOS build verified"

      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-iOS-Final
          path: |
            ios-3rdi-analog/3rdi-Analog-Percussion-iOS-Simulator.zip
            ios-3rdi-analog/3rdi-Analog-Percussion-iOS-unsigned.ipa
            ios-3rdi-analog/3rdi-Analog-Percussion-iOS-AdHoc-Signed-Final.ipa
            ios-3rdi-analog/3rdi-Analog-Percussion-iOS-Xcode-Source.zip
            ios-3rdi-analog/adhoc-codesign-info.txt
            ios-3rdi-analog/final-signing-summary.txt
            ios-3rdi-analog/final-artifact-sha256.txt
