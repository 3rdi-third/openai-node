name: Build 3RDI macOS Intel Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos-3rdi-plugin/**'
      - '.github/workflows/build-3rdi-macos-intel-plugin.yml'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Intel runner
        run: |
          set -euxo pipefail
          uname -m
          test "$(uname -m)" = "x86_64"
          xcodebuild -version

      - name: Configure JUCE project
        run: |
          cmake -S macos-3rdi-plugin -B macos-3rdi-plugin/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3 and AU
        run: |
          cmake --build macos-3rdi-plugin/build --config Release --parallel 3

      - name: Locate plugin bundles
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          VST3="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.vst3' | head -n1)"
          AU="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.component' | head -n1)"
          test -n "$VST3"
          test -n "$AU"
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "au=$AU" >> "$GITHUB_OUTPUT"

      - name: Verify Intel architecture
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN="${{ steps.locate.outputs.vst3 }}/Contents/MacOS/3RDI Analog Percussion"
          AU_BIN="${{ steps.locate.outputs.au }}/Contents/MacOS/3RDI Analog Percussion"
          file "$VST3_BIN"
          file "$AU_BIN"
          lipo -info "$VST3_BIN"
          lipo -info "$AU_BIN"
          file "$VST3_BIN" | grep -q 'x86_64'
          file "$AU_BIN" | grep -q 'x86_64'

      - name: Ad-hoc sign plugins
        run: |
          codesign --force --deep --sign - "${{ steps.locate.outputs.vst3 }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.au }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.vst3 }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.au }}"

      - name: Validate AU with auval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"
          ditto "${{ steps.locate.outputs.au }}" "$HOME/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"
          xattr -dr com.apple.quarantine "$HOME/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component" || true
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          /usr/bin/auval -a | grep -i "3RDI" || true
          /usr/bin/auval -v aumu R3ap Trdi

      - name: Build compatibility DMG
        shell: bash
        run: |
          set -euo pipefail
          DMGROOT="$RUNNER_TEMP/3rdi-dmg"
          mkdir -p "$DMGROOT/Plugins"

          ditto "${{ steps.locate.outputs.vst3 }}" "$DMGROOT/Plugins/3RDI Analog Percussion.vst3"
          ditto "${{ steps.locate.outputs.au }}" "$DMGROOT/Plugins/3RDI Analog Percussion.component"

          cat > "$DMGROOT/Install.command" <<'SCRIPT'
          #!/bin/bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          VST3_DST="$HOME/Library/Audio/Plug-Ins/VST3"
          AU_DST="$HOME/Library/Audio/Plug-Ins/Components"

          mkdir -p "$VST3_DST" "$AU_DST"
          rm -rf "$VST3_DST/3RDI Analog Percussion.vst3"
          rm -rf "$AU_DST/3RDI Analog Percussion.component"

          ditto "$HERE/Plugins/3RDI Analog Percussion.vst3" "$VST3_DST/3RDI Analog Percussion.vst3"
          ditto "$HERE/Plugins/3RDI Analog Percussion.component" "$AU_DST/3RDI Analog Percussion.component"

          xattr -dr com.apple.quarantine "$VST3_DST/3RDI Analog Percussion.vst3" 2>/dev/null || true
          xattr -dr com.apple.quarantine "$AU_DST/3RDI Analog Percussion.component" 2>/dev/null || true

          codesign --force --deep --sign - "$VST3_DST/3RDI Analog Percussion.vst3" 2>/dev/null || true
          codesign --force --deep --sign - "$AU_DST/3RDI Analog Percussion.component" 2>/dev/null || true

          killall -9 AudioComponentRegistrar 2>/dev/null || true

          echo
          echo "3RDI Analog Percussion installed successfully."
          echo "VST3: $VST3_DST"
          echo "AU:   $AU_DST"
          echo
          echo "Restart Ableton Live, then rescan Plug-Ins."
          read -n 1 -s -r -p "Press any key to close..."
          SCRIPT
          chmod +x "$DMGROOT/Install.command"

          cp macos-3rdi-plugin/README.md "$DMGROOT/README.txt"

          hdiutil create \
            -volname "3RDI Analog Percussion Intel" \
            -srcfolder "$DMGROOT" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/3RDI-Analog-Percussion-macOS-Intel-Fixed.dmg"

      - name: Verify DMG
        run: |
          set -euxo pipefail
          test -s 3RDI-Analog-Percussion-macOS-Intel-Fixed.dmg
          shasum -a 256 3RDI-Analog-Percussion-macOS-Intel-Fixed.dmg

      - name: Upload fixed DMG
        uses: actions/upload-artifact@v4
        with:
          name: 3RDI-Analog-Percussion-macOS-Intel-Fixed-DMG
          path: 3RDI-Analog-Percussion-macOS-Intel-Fixed.dmg
          if-no-files-found: error
