          test -f macos-3rdi-plugin/CMakeLists.txt
          test -f macos-3rdi-plugin/Source/PluginProcessor.cpp

      - name: Install build tools
        run: brew install cmake ninja

      - name: Configure x86_64 plugin
        working-directory: macos-3rdi-plugin
        run: |
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_OSX_ARCHITECTURES=x86_64             -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3 and AU
        working-directory: macos-3rdi-plugin
        run: cmake --build build --config Release -j 4

      - name: Locate and verify plugin bundles
        working-directory: macos-3rdi-plugin
        run: |
          set -euxo pipefail
          VST3=$(find build -type d -name '3RDI Analog Percussion.vst3' | head -n 1)
          AU=$(find build -type d -name '3RDI Analog Percussion.component' | head -n 1)
          test -n "$VST3"
          test -n "$AU"
          echo "VST3=$VST3" >> "$GITHUB_ENV"
          echo "AU=$AU" >> "$GITHUB_ENV"
          file "$VST3/Contents/MacOS/3RDI Analog Percussion"
          file "$AU/Contents/MacOS/3RDI Analog Percussion"
          lipo -info "$VST3/Contents/MacOS/3RDI Analog Percussion" | grep -q x86_64
          lipo -info "$AU/Contents/MacOS/3RDI Analog Percussion" | grep -q x86_64
          codesign --force --deep --sign - --timestamp=none "$VST3"
          codesign --force --deep --sign - --timestamp=none "$AU"
          codesign --verify --deep --strict "$VST3"
          codesign --verify --deep --strict "$AU"

      - name: Create installer package and DMG
        working-directory: macos-3rdi-plugin
        run: |
          set -euxo pipefail
          rm -rf dist pkgroot dmgroot
          mkdir -p dist pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components dmgroot
          cp -R "$VST3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU" pkgroot/Library/Audio/Plug-Ins/Components/

          pkgbuild             --root pkgroot             --identifier com.threerdi.analogpercussion.installer             --version 1.0.0             --install-location /             "dmgroot/3RDI Analog Percussion Intel Installer.pkg"

          cat > "dmgroot/Install.command" <<'SCRIPT'
          #!/bin/zsh
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Installing 3RDI Analog Percussion VST3 + AU..."
          sudo installer -pkg "$DIR/3RDI Analog Percussion Intel Installer.pkg" -target /
          sudo xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/3RDI Analog Percussion.vst3" 2>/dev/null || true
          sudo xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component" 2>/dev/null || true
          killall AudioComponentRegistrar 2>/dev/null || true
          echo "Installed. Restart Ableton Live and rescan Plug-Ins if needed."
          read "?Press Return to close..."
          SCRIPT
          chmod +x "dmgroot/Install.command"

          cat > "dmgroot/README.txt" <<'TXT'
          3RDI Analog Percussion — Intel macOS

          Formats:
          • VST3: /Library/Audio/Plug-Ins/VST3/
          • AU:   /Library/Audio/Plug-Ins/Components/

          Installation:
          1. Double-click Install.command and enter your macOS password, OR
          2. Open the .pkg installer.
          3. Restart Ableton Live.
          4. Ableton Live > Settings/Preferences > Plug-Ins > enable VST3/AU and rescan if necessary.

          This build is ad-hoc signed, not Apple Developer-ID notarized. If macOS blocks the installer,
          Control-click it and choose Open, or use Install.command.
          TXT

          hdiutil create             -volname "3RDI Analog Percussion Intel"             -srcfolder dmgroot             -ov -format UDZO             "dist/3RDI-Analog-Percussion-Intel-VST3-AU.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$VST3" "dist/3RDI-Analog-Percussion-VST3-x86_64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$AU" "dist/3RDI-Analog-Percussion-AU-x86_64.zip"
          shasum -a 256 "dist/3RDI-Analog-Percussion-Intel-VST3-AU.dmg" > "dist/SHA256.txt"

      - name: Inspect DMG
        working-directory: macos-3rdi-plugin
        run: |
          set -euxo pipefail
          file dist/3RDI-Analog-Percussion-Intel-VST3-AU.dmg
          hdiutil verify dist/3RDI-Analog-Percussion-Intel-VST3-AU.dmg
          cat dist/SHA256.txt

      - name: Upload DMG and plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: 3RDI-Analog-Percussion-Intel-VST3-AU-DMG
          path: macos-3rdi-plugin/dist/*
          if-no-files-found: error
          retention-days: 30
