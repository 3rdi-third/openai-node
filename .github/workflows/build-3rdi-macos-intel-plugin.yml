name: Build 3RDI macOS Intel Installer DMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos-3rdi-plugin/**'
      - '.github/workflows/build-3rdi-macos-intel-plugin.yml'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Intel runner
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version

      - name: Configure JUCE project
        run: |
          cmake -S macos-3rdi-plugin -B macos-3rdi-plugin/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3 and AU
        run: cmake --build macos-3rdi-plugin/build --config Release --parallel 3

      - name: Locate plugin bundles
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          VST3="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.vst3' | head -n1)"
          AU="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.component' | head -n1)"
          test -n "$VST3"
          test -n "$AU"
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "au=$AU" >> "$GITHUB_OUTPUT"

      - name: Verify Intel architecture
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN="${{ steps.locate.outputs.vst3 }}/Contents/MacOS/3RDI Analog Percussion"
          AU_BIN="${{ steps.locate.outputs.au }}/Contents/MacOS/3RDI Analog Percussion"
          file "$VST3_BIN" | grep -q 'x86_64'
          file "$AU_BIN" | grep -q 'x86_64'
          lipo -info "$VST3_BIN"
          lipo -info "$AU_BIN"

      - name: Ad-hoc sign plugins
        run: |
          codesign --force --deep --sign - "${{ steps.locate.outputs.vst3 }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.au }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.vst3 }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.au }}"

      - name: Validate AU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"
          ditto "${{ steps.locate.outputs.au }}" "$HOME/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          /usr/bin/auval -v aumu R3ap Trdi

      - name: Build component installer packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/3rdi-installer"
          PKGS="$WORK/packages"
          RES="$WORK/resources"
          VROOT="$WORK/vst3-root"
          AROOT="$WORK/au-root"
          SCRIPTS="$WORK/scripts"

          mkdir -p "$PKGS" "$RES" "$VROOT/Library/Audio/Plug-Ins/VST3" "$AROOT/Library/Audio/Plug-Ins/Components" "$SCRIPTS"

          ditto "${{ steps.locate.outputs.vst3 }}" "$VROOT/Library/Audio/Plug-Ins/VST3/3RDI Analog Percussion.vst3"
          ditto "${{ steps.locate.outputs.au }}" "$AROOT/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"

          cat > "$SCRIPTS/postinstall" <<'SCRIPT'
          #!/bin/bash
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          SCRIPT
          chmod +x "$SCRIPTS/postinstall"

          pkgbuild \
            --root "$VROOT" \
            --identifier "com.threerdi.analogpercussion.vst3" \
            --version "1.0.1" \
            --install-location "/" \
            "$PKGS/3RDI-VST3.pkg"

          pkgbuild \
            --root "$AROOT" \
            --scripts "$SCRIPTS" \
            --identifier "com.threerdi.analogpercussion.au" \
            --version "1.0.1" \
            --install-location "/" \
            "$PKGS/3RDI-AU.pkg"

          cat > "$RES/welcome.html" <<'HTML'
          <html><body style="font-family:-apple-system;font-size:13px">
          <h2>3RDI Analog Percussion</h2>
          <p>Intel macOS VST3 / Audio Unit installer for Ableton Live.</p>
          <p>The next screen lets you choose which plugin formats to install.</p>
          </body></html>
          HTML

          cat > "$RES/readme.html" <<'HTML'
          <html><body style="font-family:-apple-system;font-size:13px">
          <h3>Installation locations</h3>
          <p><b>VST3:</b> /Library/Audio/Plug-Ins/VST3</p>
          <p><b>Audio Unit:</b> /Library/Audio/Plug-Ins/Components</p>
          <p>After installation, restart Ableton Live and rescan plug-ins if needed.</p>
          </body></html>
          HTML

          cat > "$RES/conclusion.html" <<'HTML'
          <html><body style="font-family:-apple-system;font-size:13px">
          <h2>Installation complete</h2>
          <p>3RDI Analog Percussion has been installed.</p>
          <p>Restart Ableton Live and run a plug-in rescan.</p>
          </body></html>
          HTML

          cat > "$WORK/Distribution.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>3RDI Analog Percussion</title>
            <organization>com.threerdi.audio</organization>
            <domains enable_localSystem="true"/>
            <options customize="always" require-scripts="false" rootVolumeOnly="true"/>
            <welcome file="welcome.html"/>
            <readme file="readme.html"/>
            <conclusion file="conclusion.html"/>

            <choices-outline>
              <line choice="vst3"/>
              <line choice="au"/>
            </choices-outline>

            <choice id="vst3"
                    title="VST3 Plug-In"
                    description="Install the VST3 version for Ableton Live and other VST3 hosts"
                    start_selected="true">
              <pkg-ref id="com.threerdi.analogpercussion.vst3"/>
            </choice>

            <choice id="au"
                    title="Audio Unit (AU)"
                    description="Install the Audio Unit version for Ableton Live and other AU hosts"
                    start_selected="true">
              <pkg-ref id="com.threerdi.analogpercussion.au"/>
            </choice>

            <pkg-ref id="com.threerdi.analogpercussion.vst3"
                     version="1.0.1"
                     onConclusion="none">3RDI-VST3.pkg</pkg-ref>
            <pkg-ref id="com.threerdi.analogpercussion.au"
                     version="1.0.1"
                     onConclusion="none">3RDI-AU.pkg</pkg-ref>
          </installer-gui-script>
          XML

          productbuild \
            --distribution "$WORK/Distribution.xml" \
            --resources "$RES" \
            --package-path "$PKGS" \
            "$WORK/Install 3RDI Analog Percussion.pkg"

          pkgutil --check-signature "$WORK/Install 3RDI Analog Percussion.pkg" || true
          pkgutil --expand "$WORK/Install 3RDI Analog Percussion.pkg" "$WORK/expanded"
          test -f "$WORK/expanded/Distribution"
          grep -q 'VST3 Plug-In' "$WORK/expanded/Distribution"
          grep -q 'Audio Unit (AU)' "$WORK/expanded/Distribution"

      - name: Build graphical installer DMG
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/3rdi-installer"
          DMGROOT="$RUNNER_TEMP/3rdi-dmg"
          mkdir -p "$DMGROOT"

          cp "$WORK/Install 3RDI Analog Percussion.pkg" "$DMGROOT/Install 3RDI Analog Percussion.pkg"

          cat > "$DMGROOT/READ ME FIRST.txt" <<'TXT'
          3RDI ANALOG PERCUSSION — INTEL macOS

          1. Double-click "Install 3RDI Analog Percussion.pkg"
          2. The macOS Installer opens.
          3. Choose VST3, Audio Unit, or both.
          4. Complete installation.
          5. Restart Ableton Live and rescan Plug-Ins.

          If macOS blocks the installer:
          Control-click the package, choose Open, then confirm Open.
          TXT

          hdiutil create \
            -volname "3RDI Analog Percussion Installer" \
            -srcfolder "$DMGROOT" \
            -ov \
            -format UDBZ \
            "$GITHUB_WORKSPACE/3RDI-Analog-Percussion-Intel-Self-Installer.dmg"

      - name: Validate DMG contents
        shell: bash
        run: |
          set -euo pipefail
          DMG="3RDI-Analog-Percussion-Intel-Self-Installer.dmg"
          test -s "$DMG"
          MOUNT="$RUNNER_TEMP/mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse
          test -f "$MOUNT/Install 3RDI Analog Percussion.pkg"
          test -f "$MOUNT/READ ME FIRST.txt"
          pkgutil --expand "$MOUNT/Install 3RDI Analog Percussion.pkg" "$RUNNER_TEMP/final-expanded"
          test -f "$RUNNER_TEMP/final-expanded/Distribution"
          hdiutil detach "$MOUNT"
          shasum -a 256 "$DMG"

      - name: Upload installer DMG
        uses: actions/upload-artifact@v4
        with:
          name: 3RDI-Analog-Percussion-Intel-Self-Installer-DMG
          path: 3RDI-Analog-Percussion-Intel-Self-Installer.dmg
          if-no-files-found: error
