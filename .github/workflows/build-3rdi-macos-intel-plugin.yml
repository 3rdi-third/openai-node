name: Build 3RDI macOS Intel Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos-3rdi-plugin/**'
      - '.github/workflows/build-3rdi-macos-intel-plugin.yml'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Intel runner
        run: |
          set -euxo pipefail
          uname -m
          test "$(uname -m)" = "x86_64"
          xcodebuild -version

      - name: Configure JUCE project
        run: |
          cmake -S macos-3rdi-plugin -B macos-3rdi-plugin/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3 and AU
        run: |
          cmake --build macos-3rdi-plugin/build --config Release --parallel 3

      - name: Locate plugin bundles
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          VST3="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.vst3' | head -n1)"
          AU="$(find macos-3rdi-plugin/build -type d -name '3RDI Analog Percussion.component' | head -n1)"
          test -n "$VST3"
          test -n "$AU"
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "au=$AU" >> "$GITHUB_OUTPUT"

      - name: Verify Intel architecture
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN="${{ steps.locate.outputs.vst3 }}/Contents/MacOS/3RDI Analog Percussion"
          AU_BIN="${{ steps.locate.outputs.au }}/Contents/MacOS/3RDI Analog Percussion"
          file "$VST3_BIN"
          file "$AU_BIN"
          lipo -info "$VST3_BIN"
          lipo -info "$AU_BIN"
          file "$VST3_BIN" | grep -q 'x86_64'
          file "$AU_BIN" | grep -q 'x86_64'

      - name: Ad-hoc sign plugins
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "${{ steps.locate.outputs.vst3 }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.au }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.vst3 }}"
          codesign --verify --deep --strict "${{ steps.locate.outputs.au }}"

      - name: Build installer package and DMG
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/3rdi-root"
          DMGROOT="$RUNNER_TEMP/3rdi-dmg"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DMGROOT"

          ditto "${{ steps.locate.outputs.vst3 }}" "$ROOT/Library/Audio/Plug-Ins/VST3/3RDI Analog Percussion.vst3"
          ditto "${{ steps.locate.outputs.au }}" "$ROOT/Library/Audio/Plug-Ins/Components/3RDI Analog Percussion.component"

          pkgbuild \
            --root "$ROOT" \
            --identifier "com.threerdi.analogpercussion.pkg" \
            --version "1.0.0" \
            --install-location "/" \
            "$DMGROOT/Install 3RDI Analog Percussion.pkg"

          cp macos-3rdi-plugin/README.md "$DMGROOT/README.txt"

          hdiutil create \
            -volname "3RDI Analog Percussion Installer" \
            -srcfolder "$DMGROOT" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/3RDI-Analog-Percussion-macOS-Intel-VST3-AU.dmg"

      - name: Verify DMG
        run: |
          set -euxo pipefail
          test -s 3RDI-Analog-Percussion-macOS-Intel-VST3-AU.dmg
          shasum -a 256 3RDI-Analog-Percussion-macOS-Intel-VST3-AU.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: 3RDI-Analog-Percussion-macOS-Intel-VST3-AU-DMG
          path: 3RDI-Analog-Percussion-macOS-Intel-VST3-AU.dmg
          if-no-files-found: error

      - name: Upload raw plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: 3RDI-Analog-Percussion-macOS-Intel-Plugins
          path: |
            ${{ steps.locate.outputs.vst3 }}
            ${{ steps.locate.outputs.au }}
          if-no-files-found: error
