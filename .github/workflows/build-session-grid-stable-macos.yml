name: Build Session Grid Stable APK macOS

on:
  workflow_dispatch:
  push:
    branches: [session-grid-android]
    paths:
      - 'android-session-grid/**'
      - '.github/workflows/build-session-grid-stable-macos.yml'

jobs:
  stable-release-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint and unit tests
        working-directory: android-session-grid
        run: gradle --no-daemon clean lintDebug testDebugUnitTest

      - name: Build stable release APK
        working-directory: android-session-grid
        run: gradle --no-daemon assembleRelease

      - name: Verify stable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-session-grid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'res/raw/startup_intro.mp4'
          shasum -a 256 "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-session-grid-v1.5.0-stable-macos-apk
          path: android-session-grid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
