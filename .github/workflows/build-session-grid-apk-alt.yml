name: Build Session Grid APK Alternate

on:
  workflow_dispatch:
  push:
    branches: [session-grid-android]
    paths:
      - 'android-session-grid/**'
      - '.github/workflows/build-session-grid-apk-alt.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-session-grid
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-session-grid-apk-macos
          path: android-session-grid/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-session-grid
        shell: pwsh
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-session-grid-apk-windows
          path: android-session-grid/app/build/outputs/apk/debug/app-debug.apk
