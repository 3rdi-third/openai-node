name: Build Germyes 3rdi Android APK

on:
  push:
    branches: [ "germyes-3rdi-android" ]
    paths:
      - "android-remote/**"
      - ".github/workflows/build-germyes-3rdi-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-remote
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy friendly APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk Germyes_3rdi_Remote.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Germyes-3rdi-Remote-APK
          path: android-remote/Germyes_3rdi_Remote.apk
          if-no-files-found: error
