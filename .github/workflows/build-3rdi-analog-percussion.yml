name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Decode verified tiger startup artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path('android-dfam')
          raw = root / 'app/src/main/res/raw/startup_background_b64_v17.txt'
          data = base64.b64decode(''.join(raw.read_text().split()), validate=True)
          if not (len(data) > 10000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise RuntimeError('startup artwork is not a valid WebP')

          out = root / 'app/src/main/res/drawable-nodpi/startup_screen_final.webp'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print('Verified startup WebP:', len(data), 'bytes')

          # apply_v13.py still contains the former JPEG-decoding preamble.
          # Remove only that preamble in the CI workspace; the synth/theme/
          # preset integration below it remains unchanged.
          patch = root / 'apply_v13.py'
          text = patch.read_text()
          marker_start = text.index('# Decode the compact, verified original startup artwork')
          marker_end = text.index('s = main.read_text()')
          patch.write_text(text[:marker_start] + text[marker_end:])
          PY

      - name: Apply synth integration
        run: python3 android-dfam/apply_v13.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify final startup artwork is packaged
        shell: bash
        run: |
          APK='android-dfam/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" | grep -q 'startup_screen_final.webp' || { echo 'Final WebP startup artwork missing'; exit 1; }
          unzip -p "$APK" 'res/drawable-nodpi-v4/startup_screen_final.webp' > /tmp/startup.webp || \
            unzip -p "$APK" 'res/drawable-nodpi/startup_screen_final.webp' > /tmp/startup.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/startup.webp')
          data = p.read_bytes()
          if not (len(data) > 10000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise RuntimeError('Packaged startup artwork failed WebP validation')
          print('Packaged startup WebP validated:', len(data), 'bytes')
          PY

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-v2.0-APK
          path: 3rdi-Analog-Percussion-v2.0.apk
          if-no-files-found: error
          retention-days: 30
