name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Apply synth integration without startup bitmap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-dfam/apply_v13.py')
          s = p.read_text()
          start = s.index('# Build the startup artwork into a real Android drawable.')
          end = s.index('s = main.read_text()')
          p.write_text(s[:start] + s[end:])
          PY
          python3 android-dfam/apply_v13.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains no startup bitmap
        shell: bash
        run: |
          if unzip -l android-dfam/app/build/outputs/apk/debug/app-debug.apk | grep -q 'startup_screen_v17'; then
            echo 'Unexpected startup bitmap found in APK'
            exit 1
          fi
          echo 'Native startup verified: no startup_screen_v17 bitmap packaged.'

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v1.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-v1.9-APK
          path: 3rdi-Analog-Percussion-v1.9.apk
          if-no-files-found: error
          retention-days: 30
