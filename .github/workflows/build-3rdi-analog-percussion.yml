name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Render 1080p tiger startup artwork
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image, ImageFilter, ImageEnhance

          root = Path('android-dfam')
          raw = root / 'app/src/main/res/raw/startup_background_b64_v17.txt'
          data = base64.b64decode(''.join(raw.read_text().split()), validate=True)
          if not (len(data) > 10000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise RuntimeError('startup artwork is not a valid WebP')

          source = Image.open(io.BytesIO(data)).convert('RGB')
          source.load()
          print('Source startup artwork:', source.size)
          final = source.resize((1080, 1920), Image.Resampling.LANCZOS)
          final = final.filter(ImageFilter.UnsharpMask(radius=1.15, percent=115, threshold=2))
          final = ImageEnhance.Sharpness(final).enhance(1.08)

          out = root / 'app/src/main/res/drawable-nodpi/startup_screen_final.webp'
          out.parent.mkdir(parents=True, exist_ok=True)
          final.save(out, format='WEBP', quality=95, method=6)
          check = Image.open(out)
          if check.size != (1080, 1920):
              raise RuntimeError(f'Wrong startup size: {check.size}')
          print('Rendered startup artwork:', check.size, out.stat().st_size, 'bytes')

          patch = root / 'apply_v13.py'
          text = patch.read_text()
          marker_start = text.index('# Decode the compact, verified original startup artwork')
          marker_end = text.index('s = main.read_text()')
          patch.write_text(text[:marker_start] + text[marker_end:])
          PY

      - name: Generate tiger launcher icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image, ImageDraw, ImageFilter

          root = Path('android-dfam')
          raw = root / 'launcher_icon_source_b64.txt'
          data = base64.b64decode(''.join(raw.read_text().split()), validate=True)
          if not (len(data) > 1000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise RuntimeError('launcher icon source is not a valid WebP')

          source = Image.open(io.BytesIO(data)).convert('RGB')
          source.load()
          if source.size != (512, 512):
              source = source.resize((512, 512), Image.Resampling.LANCZOS)
          source = source.filter(ImageFilter.UnsharpMask(radius=0.8, percent=110, threshold=2))

          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, size in sizes.items():
              folder = root / f'app/src/main/res/mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', format='PNG', optimize=True)

              rgba = icon.convert('RGBA')
              mask = Image.new('L', (size, size), 0)
              draw = ImageDraw.Draw(mask)
              inset = max(1, round(size * 0.03))
              draw.ellipse((inset, inset, size - inset - 1, size - inset - 1), fill=255)
              rounded = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              rounded.paste(rgba, (0, 0), mask)
              rounded.save(folder / 'ic_launcher_round.png', format='PNG', optimize=True)

          print('Generated launcher icons from tiger artwork:', source.size)
          PY

      - name: Apply synth/theme/preset integration
        run: python3 android-dfam/apply_v13.py

      - name: Apply Bluetooth MIDI integration
        run: python3 android-dfam/apply_v22.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged 1080p startup artwork
        shell: bash
        run: |
          APK='android-dfam/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" | grep -q 'startup_screen_final.webp' || { echo 'Final WebP startup artwork missing'; exit 1; }
          unzip -p "$APK" 'res/drawable-nodpi-v4/startup_screen_final.webp' > /tmp/startup.webp || \
            unzip -p "$APK" 'res/drawable-nodpi/startup_screen_final.webp' > /tmp/startup.webp
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('/tmp/startup.webp')
          data = p.read_bytes()
          if not (len(data) > 10000 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise RuntimeError('Packaged startup artwork failed WebP validation')
          im = Image.open(p)
          if im.size != (1080, 1920):
              raise RuntimeError(f'Packaged startup is not 1080p: {im.size}')
          print('Packaged startup verified:', im.size, len(data), 'bytes')
          PY

      - name: Verify Bluetooth MIDI, theme UI and launcher icon
        shell: bash
        run: |
          APK='android-dfam/app/build/outputs/apk/debug/app-debug.apk'
          grep -q 'BLUETOOTH_SCAN' android-dfam/app/src/main/AndroidManifest.xml
          grep -q 'MIDI_SERVICE_UUID' android-dfam/app/src/main/java/com/threerdi/dfamstyle/BleMidiSyncManager.java
          grep -q 'BluetoothMidiActivity' android-dfam/app/src/main/AndroidManifest.xml
          grep -q 'leftScroll.setFillViewport(true)' android-dfam/app/src/main/java/com/threerdi/dfamstyle/BluetoothMidiActivity.java
          grep -q 'QUICK COLOUR PALETTE' android-dfam/app/src/main/java/com/threerdi/dfamstyle/ThemeActivity.java
          grep -q 'CYBERPUNK' android-dfam/app/src/main/java/com/threerdi/dfamstyle/ThemeActivity.java
          grep -q 'TOXIC' android-dfam/app/src/main/java/com/threerdi/dfamstyle/ThemeActivity.java
          grep -q 'android:icon="@mipmap/ic_launcher"' android-dfam/app/src/main/AndroidManifest.xml
          unzip -l "$APK" | grep -q 'ic_launcher.png' || { echo 'Launcher icon missing from APK'; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q 'application-icon' || { echo 'APK has no launcher icon metadata'; exit 1; }
          echo 'BLE MIDI, theme UI and tiger launcher icon verified.'

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v2.5-Tiger-Icon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-v2.5-Tiger-Icon-APK
          path: 3rdi-Analog-Percussion-v2.5-Tiger-Icon.apk
          if-no-files-found: error
          retention-days: 30
