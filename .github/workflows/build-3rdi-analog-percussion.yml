name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Recover startup artwork as Android drawable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          raw_path = Path('android-dfam/app/src/main/res/raw/startup_background_b64_v17.txt')
          raw = raw_path.read_text()
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          clean = ''.join(ch for ch in raw if ch in alphabet)
          clean += '=' * ((-len(clean)) % 4)
          data = base64.b64decode(clean, validate=False)

          if not data.startswith(b'\xff\xd8'):
              raise RuntimeError('Startup artwork has no JPEG SOI marker')
          eoi = data.rfind(b'\xff\xd9')
          if eoi < 0:
              raise RuntimeError('Startup artwork has no JPEG EOI marker')
          data = data[:eoi + 2]

          out = Path('android-dfam/app/src/main/res/drawable-nodpi/startup_screen_v17.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print(f'Recovered startup JPEG: {len(data)} bytes')

          # The artwork is now a real binary drawable. Remove the obsolete
          # image-decoding preamble from the integration script for this run.
          patch = Path('android-dfam/apply_v13.py')
          text = patch.read_text()
          marker_start = text.index('# Build the startup artwork into a real Android drawable.')
          marker_end = text.index('s = main.read_text()')
          patch.write_text(text[:marker_start] + text[marker_end:])
          PY

      - name: Apply fullscreen theme and preset integration
        run: python3 android-dfam/apply_v13.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-v1.8-APK
          path: 3rdi-Analog-Percussion-v1.8.apk
          if-no-files-found: error
          retention-days: 30
