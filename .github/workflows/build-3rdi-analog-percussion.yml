name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Decode verified original startup artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root=Path('android-dfam')
          raw=root/'app/src/main/res/raw'
          encoded=''.join((raw/f'startup_b64_0{i}.txt').read_text().strip() for i in range(1,5))
          data=base64.b64decode(encoded, validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise RuntimeError('startup artwork is not a valid JPEG')
          out=root/'app/src/main/res/drawable-nodpi/startup_screen_final.jpg'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print('Verified startup JPEG:',len(data),'bytes')
          patch=root/'apply_v13.py'
          text=patch.read_text()
          marker_start=text.index('# Decode the compact, verified original startup artwork')
          marker_end=text.index('s = main.read_text()')
          patch.write_text(text[:marker_start]+text[marker_end:])
          PY

      - name: Apply synth integration
        run: python3 android-dfam/apply_v13.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify final startup artwork is packaged
        shell: bash
        run: |
          unzip -l android-dfam/app/build/outputs/apk/debug/app-debug.apk | grep -q 'startup_screen_final' || { echo 'Final startup artwork missing'; exit 1; }
          echo 'Original startup artwork packaged successfully.'

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-v2.0-APK
          path: 3rdi-Analog-Percussion-v2.0.apk
          if-no-files-found: error
          retention-days: 30
