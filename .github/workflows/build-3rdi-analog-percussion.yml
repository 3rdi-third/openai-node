name: Build 3rdi Analog Percussion APK

on:
  push:
    branches: [main]
    paths:
      - 'android-dfam/**'
      - '.github/workflows/build-3rdi-analog-percussion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-dfam
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-dfam/app/build/outputs/apk/debug/app-debug.apk 3rdi-Analog-Percussion-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rdi-Analog-Percussion-APK
          path: 3rdi-Analog-Percussion-v1.0.apk
          if-no-files-found: error
          retention-days: 30
