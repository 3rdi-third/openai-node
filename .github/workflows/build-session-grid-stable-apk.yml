name: Build Session Grid Stable APK

on:
  workflow_dispatch:
  push:
    branches: [session-grid-android]
    paths:
      - 'android-session-grid/**'
      - '.github/workflows/build-session-grid-stable-apk.yml'

jobs:
  stable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static analysis and unit tests
        working-directory: android-session-grid
        run: gradle --no-daemon clean lintDebug testDebugUnitTest

      - name: Build stable release APK
        working-directory: android-session-grid
        run: gradle --no-daemon assembleRelease

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android-session-grid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          ls -lh "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-session-grid-v1.5.1-installable-apk
          path: android-session-grid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
