name: Build Session Grid APK
on:
  workflow_dispatch:
  push:
    branches: [session-grid-android]
    paths: ['android-session-grid/**', '.github/workflows/build-session-grid-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-session-grid
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3rdi-session-grid-apk
          path: android-session-grid/app/build/outputs/apk/debug/app-debug.apk
