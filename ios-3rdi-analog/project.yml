name: AnalogPercussion
options:
  bundleIdPrefix: com.threerdi
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    DEVELOPMENT_TEAM: ""
targets:
  AnalogPercussion:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.threerdi.analogpercussion
        PRODUCT_NAME: "3rdi Analog Percussion"
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
